apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-api
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo-api
  template:
    metadata:
      labels:
        app: podinfo-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/podinfo-api:1.0.0
          ports:
            - containerPort: 8080
